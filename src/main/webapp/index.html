<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Inventory Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .welcome-card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(91,27,41,0.22);
            border: 2px solid #c59a3d;
            max-width: 500px;
        }
        .welcome-card .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .welcome-card h1 {
            font-size: 28px;
            color: #651c2b;
            margin-bottom: 10px;
        }
        .welcome-card p {
            color: #8a744f;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            padding: 14px 35px;
            background-color: #651c2b;
            color: #ffffff;
            border: 1px solid #c59a3d;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #7a2939;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Hardware Inventory</h1>
        <p>Manage your hardware assets efficiently</p>
        <a href="search" class="btn">Search Inventory</a>
    </div>
</body>
</html>
